# Header proxy yang dipakai bersama oleh semua location di siaga.conf.
# Dipisah agar tidak diulang dan mudah ikut ditinjau saat berubah.
#
# Catatan: Connection "" wajib saat memakai keepalive di upstream, kalau tidak
# koneksi tidak dipakai ulang.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
