# SIAGA — konfigurasi Nginx.
#
# Perhatian khusus untuk aplikasi ini (bukan boilerplate umum):
#
# 1. /api/absensi/stream adalah Server-Sent Events. proxy_buffering harus MATI
#    dan proxy_read_timeout harus panjang. Kalau tidak, Nginx menahan respons
#    sampai buffer penuh dan aliran absensi real-time mati diam-diam.
#
# 2. index.html tidak boleh di-cache lama, supaya hasil deploy langsung terlihat.
#
# 3. Aset di /assets/ sudah diberi nama ber-hash oleh Vite, jadi aman di-cache
#    setahun penuh.
#
# 4. client_max_body_size harus di atas batas unggahan multer (5 MB per foto),
#    kalau tidak unggahan foto siswa/penjemput ditolak Nginx sebelum sampai aplikasi.
#
# 5. TRUST_PROXY=true di /etc/siaga/siaga.env wajib ada. Tanpa itu, semua request
#    tampak berasal dari 127.0.0.1 sehingga pembatasan percobaan login kehilangan
#    nilai — penyerang tersebar tetap terhitung satu IP.
#
# Untuk HTTPS: tambahkan `listen 4000 ssl;` beserta sertifikat, lalu arahkan
# ulang 3999 ke 4000. Panduan lengkapnya ada di
# docs/tencent-lighthouse-hermes-deploy.md.

upstream siaga_backend {
  server 127.0.0.1:3001;
  keepalive 32;
}

server {
  listen 3999;
  # Aktifkan baris di bawah bila server punya IPv6:
  # listen [::]:3999;
  server_name _;

  root /opt/siaga/app/frontend/dist;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/rss+xml
    image/svg+xml;

  # Di atas batas unggahan multer (5 MB).
  client_max_body_size 10m;

  # Aset ber-hash dari Vite: nama berkas berubah saat isinya berubah, jadi
  # cache panjang tidak berisiko menyajikan versi lama.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
  }

  # Logo, ikon, dan font: berubah jarang.
  location ~* \.(?:png|jpg|jpeg|svg|ico|webmanifest|woff2)$ {
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
    try_files $uri =404;
  }

  # Unggahan tetap dilayani aplikasi, bukan langsung dari disk, agar tetap satu
  # jalur jika kelak ditambahkan pemeriksaan otorisasi.
  location /uploads/ {
    include /etc/nginx/siaga/proxy_params.conf;
    proxy_pass http://siaga_backend;
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
  }

  # Stream SSE: tanpa buffering dan dengan timeout panjang.
  location = /api/absensi/stream {
    include /etc/nginx/siaga/proxy_params.conf;
    proxy_pass http://siaga_backend;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    chunked_transfer_encoding off;
  }

  location /api/ {
    include /etc/nginx/siaga/proxy_params.conf;
    proxy_pass http://siaga_backend;
  }

  # SPA fallback: rute yang tidak dikenal dilayani index.html. index.html
  # sendiri tetap no-cache agar deploy langsung terlihat.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
