name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root dependencies
        run: npm ci
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Run test suite
        run: node scripts/run-tests.js main
      - name: Run frontend unit tests
        run: node scripts/run-frontend-tests.js
      - name: Build frontend
        run: npm run build --prefix frontend
      # Uji E2E memakai build produksi yang disajikan backend, dengan database
      # sementara. Dua regresi nyata (modal Billing yang selalu terbuka dan
      # tautan PDF 401) hanya muncul di mode ini, bukan di dev server.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
